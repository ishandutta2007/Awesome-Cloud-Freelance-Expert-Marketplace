<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glowing Grid Background -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Filters -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.7; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1.5deg); }
    }
    @keyframes dashLine {
      to { stroke-dashoffset: -40; }
    }
    @keyframes shimmer {
      0% { opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { opacity: 0.3; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: center; }
    .card-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-2 { animation: floatCard2 7s ease-in-out infinite; }
    .pulse-line { stroke-dasharray: 8 8; animation: dashLine 2s linear infinite; }
    .shimmer-pill { animation: shimmer 3s ease-in-out infinite; }
  </style>

  <!-- Background Grid -->
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Ambient Glowing Orbs Background (Dynamic Aspect) -->
  <circle cx="200" cy="100" r="180" fill="#8b5cf6" filter="url(#blurGlow)" class="orb-1"/>
  <circle cx="1000" cy="300" r="200" fill="#06b6d4" filter="url(#blurGlow)" class="orb-1" style="animation-delay: -4s;"/>
  <circle cx="600" cy="350" r="150" fill="#ec4899" filter="url(#blurGlow)" class="orb-1" style="animation-delay: -2s;"/>

  <!-- Background Animated Network Nodes (Low opacity behind text) -->
  <g stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5">
    <line x1="150" y1="320" x2="350" y2="340" class="pulse-line"/>
    <line x1="850" y1="80" x2="1050" y2="120" class="pulse-line"/>
  </g>

  <!-- Side Floating Micro UI Elements (Dynamic Aspect placed in background/sides) -->
  <g class="card-1" opacity="0.6">
    <rect x="50" y="60" width="180" height="70" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" backdrop-filter="blur(10px)"/>
    <circle cx="80" cy="95" r="14" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="100" fill="#38bdf8" font-size="12" text-anchor="middle" font-weight="bold">☁️</text>
    <text x="105" y="90" fill="#f8fafc" font-size="12" font-weight="600">AWS / Cloud</text>
    <text x="105" y="106" fill="#94a3b8" font-size="10">Vetted Experts</text>
  </g>

  <g class="card-2" opacity="0.6">
    <rect x="970" y="260" width="180" height="70" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="1000" cy="295" r="14" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="2"/>
    <text x="1000" y="300" fill="#a855f7" font-size="12" text-anchor="middle" font-weight="bold">💼</text>
    <text x="1025" y="290" fill="#f8fafc" font-size="12" font-weight="600">Open Escrow</text>
    <text x="1025" y="306" fill="#94a3b8" font-size="10">Smart Talent</text>
  </g>

  <!-- Central Foreground Content (Title & Subtitle in foreground, high contrast) -->
  <g filter="url(#shadow)">
    <!-- Top Badge / Category Pill -->
    <g class="shimmer-pill">
      <rect x="420" y="55" width="360" height="34" rx="17" fill="url(#accentGlow)" fill-opacity="0.25" stroke="#a855f7" stroke-width="1.5"/>
      <text x="600" y="77" fill="#e2e8f0" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">
        ☁️ FREELANCE &amp; TALENT ECOSYSTEM 🌐
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="155" text-anchor="middle" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome Cloud Freelance
    </text>
    <text x="600" y="210" text-anchor="middle" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
      &amp; Expert Marketplace 💼
    </text>

    <!-- Subtitle -->
    <text x="600" y="265" text-anchor="middle" font-size="17" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      Curated Commercial Platforms • Open-Source Talent Networks • Enterprise Compliance &amp; Escrow
    </text>

    <!-- Feature Pills Bar -->
    <g transform="translate(300, 305)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="65" y="18" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">⚡ Vetted Talent</text>

      <rect x="145" y="0" width="140" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="215" y="18" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">🔓 Open-Source MVP</text>

      <rect x="295" y="0" width="145" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="367" y="18" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">🛡️ Escrow &amp; Compliance</text>
    </g>
  </g>
</svg>
