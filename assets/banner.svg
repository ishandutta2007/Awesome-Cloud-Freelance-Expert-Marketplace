<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400" style="background:linear-gradient(135deg,#0f172a 0,#1e1b4b 50%,#311042 100%);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"><defs><linearGradient id="accentGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".8"/><stop offset="50%" stop-color="#3b82f6" stop-opacity=".6"/><stop offset="100%" stop-color="#06b6d4" stop-opacity=".9"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#a855f7"/><stop offset="50%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#34d399"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".04" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><filter id="blurGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="40"/></filter><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="10" flood-color="#000" flood-opacity=".5" stdDeviation="15"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.4}50%{transform:scale(1.15) translate(-20px,15px);opacity:.7}}@keyframes floatCard1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes floatCard2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-1.5deg)}}@keyframes shimmer{0%{opacity:.3}50%{opacity:.9}}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:center}.card-1{animation:floatCard1 6s ease-in-out infinite}.card-2{animation:floatCard2 7s ease-in-out infinite}.pulse-line{stroke-dasharray:8 8;animation:dashLine 2s linear infinite}.shimmer-pill{animation:shimmer 3s ease-in-out infinite}</style><rect width="1200" height="400" fill="url(#grid)"/><circle cx="200" cy="100" r="180" fill="#8b5cf6" class="orb-1" filter="url(#blurGlow)"/><circle cx="1000" cy="300" r="200" fill="#06b6d4" class="orb-1" filter="url(#blurGlow)" style="animation-delay:-4s"/><circle cx="600" cy="350" r="150" fill="#ec4899" class="orb-1" filter="url(#blurGlow)" style="animation-delay:-2s"/><g stroke="#38bdf8" stroke-opacity=".2" stroke-width="1.5"><line x1="150" x2="350" y1="320" y2="340" class="pulse-line"/><line x1="850" x2="1050" y1="80" y2="120" class="pulse-line"/></g><g class="card-1" opacity=".6"><rect width="180" height="70" x="50" y="60" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".15" backdrop-filter="blur(10px)" rx="12"/><circle cx="80" cy="95" r="14" fill="#38bdf8" fill-opacity=".2" stroke="#38bdf8" stroke-width="2"/><text x="80" y="100" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">☁️</text><text x="105" y="90" fill="#f8fafc" font-size="12" font-weight="600">AWS / Cloud</text><text x="105" y="106" fill="#94a3b8" font-size="10">Vetted Experts</text></g><g class="card-2" opacity=".6"><rect width="180" height="70" x="970" y="260" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".15" rx="12"/><circle cx="1000" cy="295" r="14" fill="#a855f7" fill-opacity=".2" stroke="#a855f7" stroke-width="2"/><text x="1000" y="300" fill="#a855f7" font-size="12" font-weight="bold" text-anchor="middle">💼</text><text x="1025" y="290" fill="#f8fafc" font-size="12" font-weight="600">Open Escrow</text><text x="1025" y="306" fill="#94a3b8" font-size="10">Smart Talent</text></g><g filter="url(#shadow)"><g class="shimmer-pill"><rect width="360" height="34" x="420" y="55" fill="url(#accentGlow)" fill-opacity=".25" stroke="#a855f7" stroke-width="1.5" rx="17"/><text x="600" y="77" fill="#e2e8f0" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">☁️ FREELANCE &amp; TALENT ECOSYSTEM 🌐</text></g><text x="600" y="155" fill="#fff" font-size="44" font-weight="900" letter-spacing="-.5" text-anchor="middle">Awesome Cloud Freelance</text><text x="600" y="210" fill="url(#textGrad)" font-size="44" font-weight="900" letter-spacing="-.5" text-anchor="middle">&amp; Expert Marketplace 💼</text><text x="600" y="265" fill="#94a3b8" font-size="17" font-weight="500" letter-spacing=".2" text-anchor="middle">Curated Commercial Platforms • Open-Source Talent Networks • Enterprise Compliance &amp; Escrow</text><g transform="translate(300, 305)"><rect width="130" height="28" x="0" y="0" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".1" rx="14"/><text x="65" y="18" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">⚡ Vetted Talent</text><rect width="140" height="28" x="145" y="0" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".1" rx="14"/><text x="215" y="18" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">🔓 Open-Source MVP</text><rect width="145" height="28" x="295" y="0" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".1" rx="14"/><text x="367" y="18" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">🛡️ Escrow &amp; Compliance</text></g></g></svg>